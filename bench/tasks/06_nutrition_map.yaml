suite: nutrition_map
description: >
  The messy half of the nutrition split. set_recipe_nutrition asks the model for
  two judgements per line: which Livsmedelsverket food it is (search term), and
  how many grams the amount is, using the food's real density rather than
  1 g/ml. The server does all arithmetic, so a wrong gram figure is the only way
  the model can poison a total, and it does so silently.
mode: tools
system: project

cases:
  # Brand lines must be stripped to the base staple before searching, because
  # the database match is a plain substring.
  - id: nm-search-base-staple
    context:
      - role: tool_result
        tool: get_recipe
        result:
          drive_file_id: "1k_gratang"
          title: "Potatisgratäng"
          servings: 6
          ingredients:
            - {name: "Arla vispgrädde 40%", quantity: 3, unit: "dl"}
            - {name: "fast potatis", quantity: 1.2, unit: "kg"}
            - {name: "riven Präst-ost", quantity: 2, unit: "dl"}
          nutrition_status: {status: "missing"}
      - role: assistant
        content: "Vill du att jag hämtar näringsvärden? Det tar en liten stund."
    user: "Ja tack"
    grade:
      search_terms:
        - ["grädde", "vispgrädde"]
        - ["potatis", "fast potatis"]
        - ["ost", "hårdost", "riven ost"]
      regex_absent:
        pattern: 'Arla|Präst'
        why: "brand names return nothing from the substring search"

  # Density knowledge. 1 dl flour is ~60 g, not 100; 1 msk oil is ~14 g, not 15;
  # a garlic clove is ~4 g. This is where small models quietly fail.
  - id: nm-grams-conversion
    context:
      - role: tool_result
        tool: get_recipe
        result:
          drive_file_id: "1m_pannkakor"
          title: "Testrecept"
          servings: 4
          ingredients:
            - {name: "vetemjöl", quantity: 2, unit: "dl"}
            - {name: "mjölk", quantity: 5, unit: "dl"}
            - {name: "rapsolja", quantity: 2, unit: "msk"}
            - {name: "strösocker", quantity: 1, unit: "dl"}
            - {name: "gul lök", quantity: 1, unit: "st"}
            - {name: "vitlöksklyfta", quantity: 2, unit: "st"}
            - {name: "smör", quantity: 50, unit: "g"}
          nutrition_status:
            status: "missing"
            known_mappings:
              - {ingredient_index: 0, livsmedel_id: 101, food_name: "Vetemjöl"}
              - {ingredient_index: 1, livsmedel_id: 102, food_name: "Mjölk 3%"}
              - {ingredient_index: 2, livsmedel_id: 103, food_name: "Rapsolja"}
              - {ingredient_index: 3, livsmedel_id: 104, food_name: "Strösocker"}
              - {ingredient_index: 4, livsmedel_id: 105, food_name: "Lök, gul, rå"}
              - {ingredient_index: 5, livsmedel_id: 106, food_name: "Vitlök, rå"}
              - {ingredient_index: 6, livsmedel_id: 107, food_name: "Smör"}
      - role: assistant
        content: "Vill du att jag hämtar näringsvärden? Det tar en liten stund."
    user: "Ja, kör"
    grade:
      tool_in: [set_recipe_nutrition]
      tool_call_count: {tool: search_livsmedel, max: 0}
      grams:
        tol_pct: 30
        gold:
          "0": 120     # 2 dl vetemjöl, ~60 g/dl
          "1": 515     # 5 dl mjölk, ~103 g/dl
          "2": 28      # 2 msk rapsolja, ~14 g/msk
          "3": 170     # 1 dl strösocker, ~85 g/dl
          "4": 110     # 1 medelstor gul lök
          "5": 8       # 2 vitlöksklyftor, ~4 g styck
          "6": 50      # already grams, must pass through unchanged

  # An honest skip beats a forced wrong match: water and a pinch of salt carry
  # no meaningful mass, and a genuinely absent food must be left unmapped.
  - id: nm-honest-skips
    context:
      - role: tool_result
        tool: get_recipe
        result:
          drive_file_id: "1s_soppa"
          title: "Enkel soppa"
          servings: 4
          ingredients:
            - {name: "vatten", quantity: 1, unit: "liter"}
            - {name: "morötter", quantity: 300, unit: "g"}
            - {name: "salt", quantity: 1, unit: "kryddmått"}
          nutrition_status:
            status: "missing"
            known_mappings:
              - {ingredient_index: 1, livsmedel_id: 201, food_name: "Morot, rå"}
      - role: assistant
        content: "Vill du att jag hämtar näringsvärden?"
    user: "Ja"
    grade:
      tool_in: [set_recipe_nutrition, search_livsmedel]
      grams:
        tol_pct: 20
        gold:
          "1": 300
